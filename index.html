<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Educação Financeira na Prática</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-200 flex justify-center h-screen overflow-hidden text-gray-800 font-sans">

    <!-- Container do App simulando a tela de um celular -->
    <div class="w-full max-w-md bg-white h-full shadow-2xl flex flex-col relative overflow-hidden">
        
        <!-- Área de Conteúdo Dinâmico -->
        <main id="app-content" class="flex-1 overflow-y-auto no-scrollbar p-6 pb-24 relative bg-gray-50"></main>

        <!-- Menu Modal (Estilo Action Sheet do Duolingo) -->
        <div id="level-modal" class="hidden absolute inset-0 bg-black bg-opacity-60 z-40 flex flex-col justify-end fade-in transition-all">
            <div class="bg-white rounded-t-3xl p-6 slide-up shadow-[0_-10px_40px_rgba(0,0,0,0.2)]">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="modal-title" class="text-2xl font-black text-gray-900">Nível 1</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 font-bold text-3xl leading-none">&times;</button>
                </div>
                <p id="modal-desc" class="text-gray-500 mb-6 font-medium">Fundamentos da educação financeira.</p>
                <div class="space-y-4">
                    <button id="btn-play" class="w-full py-4 bg-green-500 text-white font-black text-lg rounded-2xl hover:bg-green-600 transition shadow-[0_5px_0_rgb(22,163,74)] btn-press">
                        🎮 Iniciar Desafio
                    </button>
                    <button id="btn-study" class="w-full py-4 bg-blue-100 text-blue-600 font-black text-lg rounded-2xl hover:bg-blue-200 transition">
                        📖 Ler Conteúdo
                    </button>
                </div>
            </div>
        </div>

        <!-- Barra de Navegação Inferior -->
        <nav id="bottom-nav" class="absolute bottom-0 w-full bg-white border-t-2 border-gray-100 flex justify-around p-3 pb-6 z-30 shadow-[0_-5px_20px_rgba(0,0,0,0.05)]">
            <button onclick="navigate('trilha')" class="nav-btn flex flex-col items-center w-1/2 text-gray-400 hover:text-blue-500 transition" data-tab="trilha">
                <span class="text-2xl mb-1 filter grayscale opacity-50 nav-icon transition-all">🗺️</span>
                <span class="text-sm font-bold tracking-wide">Trilha</span>
            </button>
            <button onclick="navigate('caderno')" class="nav-btn flex flex-col items-center w-1/2 text-gray-400 hover:text-blue-500 transition" data-tab="caderno">
                <span class="text-2xl mb-1 filter grayscale opacity-50 nav-icon transition-all">📖</span>
                <span class="text-sm font-bold tracking-wide">Caderno</span>
            </button>
        </nav>

    </div>

    <!-- Scripts Modulares -->
    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
